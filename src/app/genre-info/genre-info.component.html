<mat-card>
  <mat-card-header>
    <mat-card-title>{{ data.genre.Name }}</mat-card-title>
  </mat-card-header>
  
  <mat-card-content>
    <p><strong>Description:</strong></p>
    <p>{{ data.genre.Description }}</p>
  </mat-card-content>
  
  <mat-card-actions>
    <button mat-raised-button color="primary" mat-dialog-close>Close</button>
  </mat-card-actions>
</mat-card>
